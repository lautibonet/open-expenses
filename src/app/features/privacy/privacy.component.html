<div class="privacy">
  <header class="top-bar">
    <div class="lang-toggle" role="group" [attr.aria-label]="copy().langToggleAria">
      <button
        type="button"
        [class.active]="lang() === 'en'"
        [attr.aria-pressed]="lang() === 'en'"
        (click)="setLang('en')"
      >EN</button>
      <button
        type="button"
        [class.active]="lang() === 'es'"
        [attr.aria-pressed]="lang() === 'es'"
        (click)="setLang('es')"
      >ES</button>
    </div>
  </header>

  <main>
    <h1>{{ copy().title }}</h1>
    <p class="intro">{{ copy().intro }}</p>

    @for (section of copy().sections; track section.heading) {
      <section class="policy-section">
        <h2>{{ section.heading }}</h2>
        <p>{{ section.body }}</p>
        @if (section.email) {
          <a class="contact-email" [href]="'mailto:' + contactEmail">{{ contactEmail }}</a>
        }
      </section>
    }
  </main>

  <footer>
    <a class="home-link" routerLink="/">Open Expenses</a>
  </footer>
</div>
