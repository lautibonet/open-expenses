@if (visible()) {
  <section class="card" id="install">
    <h2>
      <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false">
        <path
          d="M8 2v7M4.5 6 8 9.5 11.5 6M2.5 13.5h11"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      {{ language.t('install.card.title') }}
    </h2>
    <p class="description">{{ language.t('install.prompt') }}</p>
    @if (canPromptInstall()) {
      <button type="button" class="btn primary" (click)="install()">
        {{ language.t('install.action') }}
      </button>
    } @else {
      <p class="unavailable">{{ language.t('install.card.unavailable') }}</p>
    }
  </section>
}
