<section class="card">
  <h2>{{ language.t('settings.language') }}</h2>
  <div class="inline-form">
    <select
      [ngModel]="selected()"
      (ngModelChange)="selected.set($event)"
      class="input small"
      [attr.aria-label]="language.t('settings.languageAria')"
    >
      @for (option of languages; track option.code) {
        <option [value]="option.code">{{ option.label }}</option>
      }
    </select>
    <button class="btn primary" (click)="applyLanguage()">
      {{ language.t('settings.update') }}
    </button>
  </div>
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="success">{{ successMessage() }}</p>
  }
</section>
