<section class="card" id="backup">
  <h2>
    <svg aria-hidden="true" viewBox="0 0 16 16" focusable="false">
      <path
        d="M4.5 12.5a3 3 0 0 1-.4-5.97 4 4 0 0 1 7.8-.8 2.75 2.75 0 0 1-.4 5.47z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      />
    </svg>
    {{ language.t('backup.card.title') }}
  </h2>
  <p class="description">{{ language.t('backup.card.description') }}</p>

  <div class="backup-actions">
    <button type="button" class="btn primary" [disabled]="isBusy()" (click)="downloadBackup()">
      {{ language.t('backup.card.download') }}
    </button>

    <input
      #fileInput
      type="file"
      accept="application/json,.json"
      class="file-input"
      (change)="onFileSelected($event)"
    />
    <button type="button" class="btn" [disabled]="isBusy()" (click)="fileInput.click()">
      {{ language.t('backup.card.restoreFromFile') }}
    </button>

    <button type="button" class="btn" [disabled]="isBusy()" (click)="restoreFromCloud()">
      {{ language.t('backup.card.restoreFrom', { method: method }) }}
    </button>
  </div>

  <app-dismissible-alert
    variant="info"
    [message]="isBusy() ? language.t('backup.card.working') : ''"
    [resetKey]="statusEpoch()"
  />
  <app-dismissible-alert
    variant="success"
    [message]="message()"
    [resetKey]="statusEpoch()"
  />
  <app-dismissible-alert
    variant="error"
    [message]="errorMessage()"
    [resetKey]="statusEpoch()"
  />

  @if (pendingRestore()) {
    <div class="restore-confirm">
      <p>
        {{ language.t('backup.card.backupFromLabel') }}
        <strong>{{ backupDate() }}</strong>
      </p>
      <p class="warning">{{ language.t('backup.card.replacesAllData') }}</p>
      <div class="restore-confirm-actions">
        <button
          type="button"
          class="btn danger filled"
          [disabled]="isBusy()"
          (click)="confirmRestore()"
        >
          {{ language.t('backup.card.restoreData') }}
        </button>
        <button type="button" class="btn" [disabled]="isBusy()" (click)="cancelRestore()">
          {{ language.t('backup.card.cancel') }}
        </button>
      </div>
    </div>
  }
</section>
