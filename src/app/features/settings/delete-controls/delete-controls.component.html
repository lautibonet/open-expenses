@if (flow().isConfirming(target())) {
  <span class="visually-hidden" aria-live="polite">
    {{ language.t(copy().prompt) }}
  </span>
  <button
    type="button"
    class="btn small danger icon-btn"
    (click)="confirmed.emit()"
    [attr.aria-label]="language.t('settings.confirmDeletionAria')"
    [title]="language.t('settings.confirmDeletionAria')"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path
        d="M20 6 9 17l-5-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <button
    type="button"
    class="btn small icon-btn"
    (click)="flow().cancel()"
    [attr.aria-label]="language.t('settings.cancelDeletionAria')"
    [title]="language.t('settings.cancelDeletionAria')"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path
        d="M18 6 6 18M6 6l12 12"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
} @else {
  <button
    type="button"
    class="btn small icon-btn"
    (click)="requested.emit()"
    [attr.aria-label]="language.t(copy().deleteAria)"
    [title]="language.t(copy().deleteAria)"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path
        d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
}
