<a class="skip-link" href="#main-content" (click)="skipToContent($event)">{{
  language.t('shell.skipToContent')
}}</a>

<aside class="sidebar">
  <div class="brand-block">
    <div class="brand">
      <span class="monogram" aria-hidden="true">O</span>
      <span class="wordmark">Open Expenses</span>
    </div>
    <p class="status-chip">{{ language.t('shell.storageStatus') }}</p>
  </div>

  <nav class="tab-bar" [attr.aria-label]="language.t('shell.primaryNavAria')">
    <a
      routerLink="/movements"
      routerLinkActive="active"
      #movementsTab="routerLinkActive"
      class="tab"
      [attr.aria-current]="movementsTab.isActive ? 'page' : null"
      ><span class="tab-label">{{ language.t('shell.movements') }}</span></a
    >
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      #statsTab="routerLinkActive"
      class="tab"
      [attr.aria-current]="statsTab.isActive ? 'page' : null"
      ><span class="tab-label">{{ language.t('shell.stats') }}</span></a
    >
    <a
      routerLink="/settings"
      routerLinkActive="active"
      #settingsTab="routerLinkActive"
      class="tab"
      [attr.aria-current]="settingsTab.isActive ? 'page' : null"
      ><span class="tab-label">{{ language.t('shell.settings') }}</span></a
    >
  </nav>

  <div class="sidebar-actions">
    <button type="button" class="quick-add" (click)="goToQuickAdd()">
      {{ language.t('shell.quickAdd') }}
    </button>
    <div class="backup-block" role="group" [attr.aria-label]="language.t('backup.sidebar.ariaLabel')">
      <button
        type="button"
        class="backup-button"
        (click)="backUp()"
        [disabled]="isBackingUp()"
      >
        {{
          isBackingUp()
            ? language.t('backup.action.backingUp')
            : language.t('backup.action.backUp')
        }}
      </button>
      <p class="backup-caption">{{ backupCaption() }}</p>
    </div>
  </div>
</aside>

<header class="top-bar">
  <div class="brand">
    <span class="monogram" aria-hidden="true">O</span>
    <span class="wordmark">Open Expenses</span>
  </div>
  <p class="status-chip">{{ language.t('shell.storageStatus') }}</p>
</header>

<div class="main-area">
  <app-install-prompt />
  <main class="content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
