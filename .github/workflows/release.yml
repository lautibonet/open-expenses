name: Release

# Every `v*` tag pushed to the repository gets a GitHub Release.
# Release notes come from a notes file `<tag>.md` in .github/release-notes/
# when it exists (e.g. .github/release-notes/v1.6.0.md); otherwise they fall
# back to the tag annotation message (git tag -a -m "…"). Run the Release
# Notes agent skill, or write the file by hand, before tagging.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch the tag object itself so its annotation message is readable.
          fetch-depth: 0

      - name: Resolve release notes
        run: |
          NOTES_FILE=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-notes.md
          else
            git tag -l --format='%(contents)' "${{ github.ref_name }}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Open Expenses ${{ github.ref_name }}
          body_path: release-notes.md
